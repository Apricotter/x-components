name: release

# EVERY RELEASE AFTER THE FIRST. Trusted publishing, no token: CI stages
# the release, and a maintainer with 2FA approves it on npmjs.com before
# anyone can install it. On npmjs.com, set the trusted publisher's allowed
# actions to npm stage publish alone, which is always allowed; leave direct
# npm publish unticked. This workflow has no token to fall back on, and
# runs no npm publish.
#
# ACTIONS ARE PINNED TO COMMIT SHAS, not tags. A tag can move to a different
# commit; a workflow with publish access should not trust a third party to
# keep pointing it at the same code. The version after # is for a human
# reading this file, not for git.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # THE TARBALL HOLDS ONLY THE PROJECTED FILES. package.json's own
      # "files" list is the one true answer; this fails the job the moment
      # a stray file (or a missing one) would ship.
      - name: Verify the tarball's file list
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const pkg = require("./package.json");
            const expected = new Set([...pkg.files, "package.json", "README.md", "LICENSE"]);
            const packed = new Set(
              JSON.parse(execSync("npm pack --dry-run --json").toString())[0].files.map((f) => f.path)
            );
            const missing = [...expected].filter((f) => !packed.has(f));
            const extra = [...packed].filter((f) => !expected.has(f));
            if (missing.length || extra.length) {
              console.error("Tarball file list does not match the projection.");
              if (missing.length) console.error("  missing:", missing.join(", "));
              if (extra.length) console.error("  extra:  ", extra.join(", "));
              process.exit(1);
            }
            console.log("OK: tarball holds exactly the projected files.");
          '

      # STAGING NEEDS npm 11.15.0. The npm that comes with the runner's Node
      # may be older; stop here, before anything is sent, if it is.
      - name: Check npm can stage
        run: |
          node -e '
            const need = "11.15.0".split(".").map(Number);
            const have = require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            const ok = have[0] !== need[0] ? have[0] > need[0] : have[1] !== need[1] ? have[1] > need[1] : have[2] >= need[2];
            if (!ok) {
              console.error("npm " + have.join(".") + " cannot stage. Staged publishing needs 11.15.0 or later.");
              process.exit(1);
            }
            console.log("OK: npm " + have.join(".") + " can stage.");
          '

      - name: Stage the release
        run: npm stage publish
